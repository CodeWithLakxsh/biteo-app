name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        # Errors-only gate. The repo carries pre-existing info-level style
        # lints (package imports, deprecated members, const constructors);
        # those are non-blocking. Genuine compile errors still fail the build.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Unit tests
        run: flutter test

      # Compile validation. Debug build only: uses the debug signing key and
      # never requires production credentials. The Google Services Gradle
      # plugin is not applied, google-services.json is not needed, and the
      # Maps placeholder defaults to MISSING_KEY, so this builds cleanly with
      # no secrets. Flutter regenerates local.properties from the SDK path.
      - name: Android debug build (compile validation)
        run: flutter build apk --debug

  secret-scan:
    name: secret scan gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for leaked secrets
        run: |
          # google-services.json is not committed (supplied via CI secrets);
          # firebase_options.dart intentionally holds public Firebase client
          # API keys (AIzaSy...) and is excluded from the scan.
          if grep -RInE 'rzp_(test|live)_[0-9A-Za-z]{10,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |)PRIVATE KEY' \
              --exclude-dir={.git,node_modules,build,.dart_tool} \
              --exclude='google-services.json' \
              --exclude='firebase_options.dart' \
              .; then
            echo "::error::Possible leaked secret found. See lines above."
            exit 1
          fi
          echo "Secret scan passed."
