# ============================================================
# BITEO — Enterprise pubspec.yaml
# ============================================================

name: biteo
description: "Biteo – Hyper-local food marketplace. Real-time discounts from premium cafes and QSRs."

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

# ============================================================
# PRODUCTION DEPENDENCIES
# ============================================================
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # ── [ 1 ] NAVIGATION ────────────────────────────────────
  go_router: ^14.3.0

  # ── [ 2 ] STATE MANAGEMENT (RIVERPOD) ───────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── [ 3 ] DATA MODELS (FREEZED) ─────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── [ 4 ] FIREBASE SUITE ────────────────────────────────
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  cloud_functions: ^6.0.0
  firebase_messaging: ^16.2.2
  firebase_remote_config: ^6.0.0
  firebase_app_check: ^0.4.0



  # ── [ 5 ] GEO & LOCATION ────────────────────────────────
  geolocator: ^13.0.1
  geocoding: ^4.0.0
  geoflutterfire_plus: ^0.0.34

  # ── [ 6 ] PAYMENTS ──────────────────────────────────────
  razorpay_flutter: ^1.3.6

  # ── [ 7 ] UI — IMAGES & MEDIA ───────────────────────────
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1

  # ── [ 8 ] UI — FONTS & THEMING ──────────────────────────
  google_fonts: ^6.2.1

  # ── [ 9 ] ENVIRONMENT & SECRETS ─────────────────────────
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.2

  # ── [ 10 ] CRYPTO & SECURITY ────────────────────────────
  crypto: ^3.0.3

  # ── [ 11 ] DEVICE & CONNECTIVITY ────────────────────────
  connectivity_plus: ^6.0.5
  permission_handler: ^11.3.1
  package_info_plus: ^8.1.0

  # ── [ 12 ] LOCAL PERSISTENCE ────────────────────────────
  shared_preferences: ^2.3.2

  # ── [ 13 ] NOTIFICATIONS ────────────────────────────────

  # ── [ 14 ] UTILITIES ────────────────────────────────────
  intl: ^0.20.2
  uuid: ^4.5.3
  logger: ^2.7.0
  url_launcher: ^6.3.2
  dartz: ^0.10.1
  equatable: ^2.0.5
  google_maps_flutter: ^2.17.0
  http: ^1.6.0
  debounce_throttle: ^2.0.0
  flutter_local_notifications: ^21.0.0

# ============================================================
# DEV DEPENDENCIES
# ============================================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── LINTING ─────────────────────────────────────────────
  flutter_lints: ^4.0.0

  # ── CODE GENERATION ─────────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

  # ── ASSET TOOLING ───────────────────────────────────────
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

  # ── RIVERPOD GENERATOR ──────────────────────────────────
  riverpod_generator: ^2.6.3

# ============================================================
# FLUTTER CONFIGURATION
# ============================================================
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/

# ============================================================
# FLUTTER LAUNCHER ICONS CONFIGURATION
# ============================================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

# ============================================================
# FLUTTER NATIVE SPLASH CONFIGURATION
# ============================================================
flutter_native_splash:
  color: "#FF6B6B"
  image: assets/images/splash_logo.png

  android_12:
    color: "#FF6B6B"
    image: assets/images/splash_logo.png
    icon_background_color: "#FF6B6B"

  web: false